# KAOS policy — what this agent is allowed to do, in one readable file.
#
# Copy to policy.yaml (or point KAOS_POLICY_FILE at it). Without the file KAOS
# behaves exactly as before, using the code defaults shown here.
#
# Precedence: env > policy > default. An explicit environment variable wins over
# this file, so an operator hotfix is never silently ignored. Run
# `kaos policy report` to see which source won for every value.
#
# Secrets never live here — keys stay in .env.

version: 1

# Risky runtime surfaces. Enable only in trusted deployments.
capabilities:
  dynamic_tools: false                # LLM-authored Python tools
  dynamic_tool_sandbox_required: true # ...and only inside the Docker sandbox
  mcp_gateway_management: false       # add/remove MCP servers at runtime
  dynamic_mcp_servers: false          # load MCP servers persisted by the agent
  server_ops: false                   # SSH / systemd / docker control

# Which tool calls pause for a human. Empty lists mean "use engine defaults"
# (mcp_add_server, add_expense, deploy*/send*/delete* prefixes, and so on) —
# an empty list is far likelier to be an omission than an intent to gate nothing.
approvals:
  enabled: true
  always: []
  action_prefixes: []
  read_only_prefixes: []

# Spend ceilings. The daily limit is swarm-wide; per_agent_daily_usd narrows it
# for individual agents (see Swarm 3.0).
budgets:
  daily_usd: 5.0
  session_usd: 1.0
  degrade_at_fraction: 0.8            # above this, drop to the lite tier
  per_agent_daily_usd: {}

# Content coming from outside the process (web pages, MCP servers, documents,
# receipt emails, public channels).
untrusted_output:
  default_for_external: true          # mark every external tool untrusted
  on_injection: log                   # log | strip | block

# Where the agent may reach. `open` is the current behaviour; switch to
# allowlist with dry_run first and watch the logs before enforcing.
egress:
  mode: open                          # allowlist | open
  dry_run: true
  domains: []
    # Typical set for a full install — check `kaos policy report` and the
    # dry-run log before enforcing, since a missing host silently stops a job:
    # - api.telegram.org            # bridge + notifications
    # - t.me                        # public channel signals
    # - api.search.brave.com        # web search
    # - api.exa.ai                  # search fallback
    # - "*.githubusercontent.com"   # skill imports
    # - itunes.apple.com            # App Store signals
    # ...plus your own analytics hosts (Grafana, Zabbix, Sentry, PostHog,
    # Supabase, Langfuse, Linear): they are configured by URL in .env, so the
    # allowlist must include whichever ones you actually use.
  allowed_commands: []                # stdio MCP servers, e.g. npx / uvx

# How long local history is kept.
retention:
  turn_journal_days: 30
  audit_jsonl_days: 90
  swarm_messages_days: 30

# What happens to a turn whose process died mid-flight.
#   report (default) — restore the history and note the interruption; the user's
#                      question stays unanswered. This is the historical
#                      behaviour, kept as default so an upgrade changes nothing.
#   resume           — finish the turn. Safe because answered tool calls are
#                      memoized per turn and side-effecting tools consult the
#                      effects ledger, so nothing is sent or charged twice.
durable:
  resume_mode: report                 # report | resume
  max_resume_attempts: 2              # then the turn is failed, not retried forever

pii:
  mask_in_logs: true
  mask_in_cassettes: true

# Where skills may come from and how much they must prove (see docs/REGISTRY.md).
registry:
  # Public keys allowed to sign a skill, in ssh-keygen allowed_signers form.
  trusted_keys: []
  # Applies to a source in registry.yaml that declares no trust level.
  trust_default: checksum      # signed | checksum | none
  # A skill whose own scenario fails stays a draft.
  require_eval_on_install: true
  # off = nothing is assembled for sharing; local = counters are yours only;
  # share = `kaos skills stats --share` prints an anonymous aggregate.
  telemetry: off               # off | local | share

# How much a self-improvement proposal must prove before the owner sees it.
evolution:
  # Share of scenarios allowed to regress. 0 = any new failure is auto-rejected.
  max_regression_pct: 0
  # false keeps every proposal pending, measurement attached, nothing auto-decided.
  auto_reject: true
